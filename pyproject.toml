[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "employee-helpdesk-mcp"
version = "1.0.0"
description = "Production-style MCP server and client for an internal employee help desk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

